# ============================================================
# NGINX CONFIG - TGA TOOLS (Fran López)
# Frontend:  C:\Users\CGV\Desktop\tga-tools\tga-tools\frontend
# Backend:   Flask (localhost:5000)
# Public URL: https://tga-tools.ngrok.dev
# ============================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # --- Gzip (mejor rendimiento) ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_proxied any;
    gzip_min_length 1000;

    # --- Logs ---
    access_log  logs/access.log;
    error_log   logs/error.log;

    # --- Servidor principal ---
    server {
        listen 80;
        server_name localhost;

        # --- FRONTEND ---
        root   C:/Users/CGV/Desktop/tga-tools/tga-tools/frontend;
        index  index.html index.htm;

        # Sirve la SPA (maneja rutas del front)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # --- BACKEND / API ---
        location /api/ {
            proxy_pass http://127.0.0.1:5000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Origin, X-Requested-With, Content-Type, Accept' always;

            # Opcional: manejo de preflight (CORS)
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Origin, X-Requested-With, Content-Type, Accept';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        # --- Manejo de errores ---
        error_page 404 /index.html;
    }
}
